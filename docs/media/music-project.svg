    <rect x="24" y="26" width="452" height="578" rx="34" fill="#0b2527" fill-opacity=".52" stroke="#ddfff7" stroke-opacity=".12"/>
    <circle cx="250" cy="250" r="154" fill="url(#disc)" stroke="#ddfff8" stroke-opacity=".72" stroke-width="3"/>
    <circle cx="250" cy="250" r="117" fill="none" stroke="#f0fff9" stroke-opacity=".43" stroke-width="2"/>
    <circle cx="250" cy="250" r="78" fill="none" stroke="#f0fff9" stroke-opacity=".36" stroke-width="2"/>
    <circle cx="250" cy="250" r="20" fill="#e8fff7" fill-opacity=".9"/>
    <g stroke="#dcfff7" stroke-linecap="round" stroke-width="8" opacity=".9">
      <path d="M82 476v-25m28 44v-65m28 87v-105m28 66v-28m28 46v-65m28 88v-110m28 78v-45m28 58v-82m28 59v-38m28 60v-101m28 73v-45m28 64v-78m28 48v-26m28 34v-51m28 38v-25"/>
