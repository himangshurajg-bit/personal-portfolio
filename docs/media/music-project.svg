<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">Himangshu Music project illustration</title>
  <desc id="desc">A glass-like music player illustration with an abstract album disc and glowing sound waves. This is project artwork, not an app screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c2d"/><stop offset=".55" stop-color="#183c3b"/><stop offset="1" stop-color="#0c2023"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#62e0cf" stop-opacity=".33"/><stop offset="1" stop-color="#62e0cf" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#e8fff8" stop-opacity=".24"/><stop offset="1" stop-color="#d7fff2" stop-opacity=".04"/></linearGradient>
    <linearGradient id="disc" x2="1" y2="1"><stop stop-color="#b7f8e5"/><stop offset=".48" stop-color="#63c9b8"/><stop offset="1" stop-color="#285d61"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1440" height="1050" rx="44" fill="url(#bg)"/>
  <ellipse cx="1070" cy="440" rx="410" ry="390" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#8bf4df" stroke-opacity=".25"><circle cx="1050" cy="478" r="305"/><circle cx="1050" cy="478" r="260"/><circle cx="1050" cy="478" r="215"/></g>
  <g transform="translate(745 155)">
