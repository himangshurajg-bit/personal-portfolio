    <text x="250" y="570" text-anchor="middle" fill="#e9fff9" font-family="Arial, sans-serif" font-size="16" letter-spacing="5">PLAY · DISCOVER · REPEAT</text>
  </g>
  <g fill="#e5fff7" font-family="Arial, Helvetica, sans-serif">
